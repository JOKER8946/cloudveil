{% extends "base.html" %}
{% block title %}Sign in · CloudVeil{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-veil-900">Welcome to CloudVeil</h1>
    <p class="mt-1 text-sm text-slate-500">Your documents, encrypted end-to-rest on Azure.</p>
  </div>

  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-5 flex rounded-lg bg-slate-100 p-1 text-sm font-medium">
      <button id="tab-login" class="flex-1 rounded-md py-2 text-white bg-veil-600">Sign in</button>
      <button id="tab-register" class="flex-1 rounded-md py-2 text-slate-600">Register</button>
    </div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-veil-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600">Password</label>
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-veil-500 focus:outline-none" />
      </div>
      <button class="w-full rounded-lg bg-veil-600 py-2 font-medium text-white hover:bg-veil-700">Sign in</button>
    </form>

    <form id="form-register" class="hidden space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600">Full name</label>
        <input name="full_name" type="text" required
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-veil-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600">Email</label>
        <input name="email" type="email" required autocomplete="email"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-veil-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600">Password <span class="text-slate-400">(min 8 chars)</span></label>
        <input name="password" type="password" required minlength="8" autocomplete="new-password"
               class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-veil-500 focus:outline-none" />
      </div>
      <button class="w-full rounded-lg bg-veil-600 py-2 font-medium text-white hover:bg-veil-700">Create account</button>
      <p class="text-center text-xs text-slate-400">New accounts are students. Officers/admins are set by an administrator.</p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
