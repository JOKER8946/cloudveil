<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CloudVeil{% endblock %}</title>
    <meta name="description" content="CloudVeil — Secure Data. Anywhere. Envelope-encrypted document platform on Azure." />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  </head>
  <body class="h-full bg-slate-50 text-slate-800 antialiased">
    <header class="bg-veil-900 text-white shadow">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="/" class="flex items-center gap-2 font-semibold">
          <span class="inline-block h-6 w-6 rounded bg-veil-500 text-center leading-6">🛡</span>
          <span>CloudVeil</span>
          <span class="hidden text-xs font-normal text-veil-50/70 sm:inline">Secure Data. Anywhere.</span>
        </a>
        <nav class="flex items-center gap-4 text-sm">
          <a href="/how-it-works" class="text-veil-50/80 hover:text-white">How it works</a>
          <span id="nav-user" class="hidden items-center gap-3 sm:flex"></span>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-8">
      <div id="toast" class="fixed right-4 top-4 z-50 hidden rounded-lg px-4 py-3 text-sm shadow-lg"></div>
      {% block content %}{% endblock %}
    </main>

    <footer class="mx-auto max-w-6xl px-4 py-8 text-center text-xs text-slate-400">
      CloudVeil · envelope encryption on Azure · MCA project
    </footer>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
