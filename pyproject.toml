[project]
name = "cloudveil"
version = "0.1.0"
description = "CloudVeil — Secure Data. Anywhere. Envelope-encrypted file platform on Azure."
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "migrations/"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",  # function call in argument defaults (Flask/Limiter idiom)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/static/*", "*/migrations/*"]
